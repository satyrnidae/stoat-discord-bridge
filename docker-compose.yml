services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  bridge:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Always the containerized Mongo above, regardless of whatever
      # MONGO__URI .env has for e.g. running the bridge directly on the
      # host - env_file is applied first, then this overrides it.
      MONGO__URI: mongodb://mongo:27017
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./certs:/app/certs:ro

volumes:
  mongo-data:
