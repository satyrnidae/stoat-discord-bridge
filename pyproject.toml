[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoat-discord-bridge"
version = "0.1.0"
description = "Multi-way chat bridge: Discord <-> Stoat (public + self-hosted) <-> IRC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 2.5.0 is the first release to declare `audioop-lts; python_version >= "3.13"`,
    # which supplies the `audioop` module discord.py's player.py imports after PEP 594
    # removed it from the stdlib in 3.13. See issue #22.
    "discord.py>=2.5.0",
    "stoat.py>=1.2.0",
    "irc>=20.3.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0",
    "motor>=3.6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
# N-way voice bridging (issue #113 Phase 3). Both discord-ext-voice-recv and
# livekit are pinned exactly:
#  - discord-ext-voice-recv hooks discord.py's undocumented voice internals
#    and has never left pre-release - an unpinned range could silently pull
#    a build that no longer matches the discord.py version above. A pin
#    without `>=`/`<` still installs cleanly without `--pre`.
#  - livekit's Python API isn't yet at 1.0 stability guarantees either.
# Bumping either happens deliberately, re-verifying voice still works, not
# as a side effect of a routine dependency update.
#
# discord-ext-voice-recv==0.5.2a179 predates Discord's DAVE (end-to-end
# encryption) rollout entirely - its receive path only ever did transport
# (SRTP) decryption, so a DAVE-encrypted call's Opus payload reaches the
# decoder still MLS-ciphertext, producing near-constant `OpusError:
# corrupted stream` or outright garbled audio ("digital auditory vomit").
# `services/discord_service/_compat.py`'s `apply_voice_recv_patches`
# monkeypatches the actual decode call site to decrypt via discord.py's own
# `davey`-backed `DaveSession` first (mirroring upstream's own unmerged
# PR #58), and to substitute silence for a packet that still fails
# afterward instead of crashing the whole receive connection. `davey` isn't
# listed as a direct dependency here since discord.py[voice]>=2.5 already
# requires it. Re-check `apply_voice_recv_patches` against upstream's own
# fix (PR #58, or whatever supersedes it - #54/#56 cover similar ground)
# before ever bumping discord-ext-voice-recv off this pin.
voice = [
    "discord.py[voice]>=2.5",
    "discord-ext-voice-recv==0.5.2a179",
    "livekit==1.1.18",
]

[project.scripts]
stoat-discord-bridge = "stoat_discord_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so `tests/` is importable as a package
# (the receiver/dispatch suites do `from tests.fakes.fake_* import ...`).
pythonpath = ["."]
filterwarnings = [
    # Upstream stoat.py: stoat/ext/commands/core.py uses the deprecated
    # asyncio.iscoroutinefunction (removed in Python 3.16). Not ours to fix. See issue #11.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:stoat.ext.commands.core",
    # Upstream discord.py: player.py does a module-level `import audioop` (used only on
    # the voice-playback path the bridge never touches). Deprecated on 3.11-3.12; on 3.13
    # discord.py pulls the `audioop-lts` backport instead. Not ours to fix. See issue #22.
    "ignore:'audioop' is deprecated:DeprecationWarning:discord.player",
    # Our own voice mixing pipeline (issue #113 Phase 3) uses audioop directly for
    # resample/mix - same audioop/audioop-lts split as above, same non-fix.
    "ignore:'audioop' is deprecated:DeprecationWarning:stoat_discord_bridge.services.voice.pipeline",
]
