name: Question
title: Question
about: Ask a general question about this project
labels: [question]
body:
  - type: input
    attributes:
      label: Title
      description: "Prefix your title so it starts with the word investigation, for example \"investigation why does X happen\"."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Question
      description: Describe your question in detail.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant context
      description: |
        Add any background, examples or details that help explain the question (code snippets, links, etc.).
      placeholder: Paste relevant context here...
    validations:
      required: false
  - type: input
    attributes:
      label: Repository / version
      description: The project repository and version you are asking about.
    validations:
      required: true
