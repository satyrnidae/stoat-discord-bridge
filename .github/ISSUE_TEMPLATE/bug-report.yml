name: Bug report
title: Bug report
about: Report something that is not working as expected
labels: [bug]
body:
  - type: input
    attributes:
      label: Title
      description: "Prefix your title so it starts with the word fix, for example \"fix crash on empty config\"."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The exact steps to reproduce the behavior if relevant to this project.
      placeholder: |
        1. First step...
        2. Second step...
        3. Bug appears...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected result
      description: What you expected to happen instead of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or error text
      description: |
        If relevant, paste any log output, stack trace or error message that shows what went wrong.
      placeholder: Paste logs or an error message here...
    validations:
      required: false
  - type: input
    attributes:
      label: Version / build
      description: The project version or commit you are using when the bug occurred.
    validations:
      required: true
  - type: input
    attributes:
      label: OS / platform
      description: The operating system and platform where the bug happens (e.g. Linux x86_64, Windows 11).
    validations:
      required: true
